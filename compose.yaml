# Qdrant per lo sviluppo su dollaro (ADR-0006). I dati sono cache: si ricostruiscono.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: dielabs-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
