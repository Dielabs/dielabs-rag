- id: guidellm-03
  software: guidellm
  version: "0.8.0"
  question: "How do I benchmark with my own prompts stored in a JSONL file?"
  expected: [guides/datasets/, examples/custom-jsonl-dataset/]

- id: guidellm-04
  software: guidellm
  version: "0.8.0"
  question: "How do I check if the server meets a latency target like TTFT under 500 ms?"
  expected: [guides/service_level_objectives/]

