# Configurazione generale dell'app (ADR-0004). I segreti stanno in .env, non qui.

chunking:                  # taglio in pezzi (ADR-0007)
  max_chars: 3200          # tetto di un pezzo, circa 800 token
  code_max_chars: 20000    # oltre, un blocco di codice si divide (limite di bge-m3 con margine per il codice)
  overlap_max_chars: 400   # sovrapposizione solo se l'ultimo paragrafo è più corto di così

qdrant:                    # ADR-0006
  url: http://localhost:6333
  collection: docs
  timeout: 120

embedding:                 # bge-m3 su Infinity (ADR-0003)
  url: http://192.168.4.82:7997
  model: BAAI/bge-m3
  batch_size: 16
  timeout: 300

reranker:                  # bge-reranker-v2-m3 sullo stesso Infinity (ADR-0003)
  url: http://192.168.4.82:7997
  model: BAAI/bge-reranker-v2-m3
  timeout: 120

search:                    # una KB per richiesta (ADR-0002)
  prefetch: 50             # candidati per ciascuna delle due ricerche (denso, BM25) prima della fusione RRF
  candidates: 30           # candidati dopo la fusione, prima della deduplica
  top: 10                  # risultati restituiti dopo il reranker

answer:                    # risposta con citazioni (Blocco 6)
  sections: 5              # sezioni intere passate al modello
  max_chars_section: 12000 # tetto per singola sezione, oltre si taglia in coda
  max_chars_total: 30000   # tetto totale del contesto (circa 7.500 token)

openrouter:                # GLM 5.3 Flash, solo provider FP8 (ADR-0003); chiave in .env
  url: https://openrouter.ai/api/v1
  model: z-ai/glm-5.3-flash
  quantizations: [fp8]
  max_tokens: 1500
  temperature: 0.2
  timeout: 180
