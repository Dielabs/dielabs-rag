# Scheda di configurazione del software lm-evaluation-harness (EleutherAI), detto lm-eval.
name: lmeval
display_name: lm-eval
repo: https://github.com/EleutherAI/lm-evaluation-harness.git
type: markdown        # nessun sito da costruire: si leggono i Markdown del repo al tag (ADR-0010)

versions:
  # ultime due release stabili (tag), come GuideLLM (ADR-0001)
  rule: latest_release
  keep: 2

markdown:
  include:
    - README.md       # guida d'uso principale (installazione, backend, modelli), fuori da docs/
    - docs/*.md       # i README dei singoli task (lm_eval/tasks/) restano fuori (2026-10-30)
  exclude: []
  public_url: https://github.com/EleutherAI/lm-evaluation-harness/blob/v{version}/
