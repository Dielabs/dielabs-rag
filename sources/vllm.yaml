# Scheda di configurazione del software vLLM.
name: vllm
display_name: vLLM
repo: https://github.com/vllm-project/vllm.git
type: mkdocs          # tipo di sorgente: come si prende la documentazione (ADR-0010)

versions:
  # ultime N minori stabili, ognuna alla .0; niente release candidate, patch ignorate
  rule: latest_minors
  keep: 3

build:
  image: python:3.12
  requirements: requirements/docs.txt
  config: mkdocs.yaml
  env:
    API_AUTONAV_EXCLUDE: vllm   # riferimento API escluso (ADR-0001)

extract:
  content_selector: article.md-content__inner
  remove_selectors:
    - a.headerlink
    - aside.md-source-file
    - a.md-content__button
  exclude_paths:
    - api/
    - search/
    - assets/
  public_url: https://docs.vllm.ai/en/v{version}/

search:
  # quando lo stesso testo sta in più pagine (parametri del motore copiati in ogni pagina CLI),
  # si mostra la copia nella prima di queste pagine (ADR-0002)
  prefer_paths:
    - cli/serve/
    - configuration/engine_args/
